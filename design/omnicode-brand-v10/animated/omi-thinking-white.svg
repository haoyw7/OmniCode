<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" class="omi-motion omi-motion-thinking" role="img" aria-label="Omi · 思考" data-state="thinking" data-duration="2.4">
  <style>
@keyframes omi-thinking-face { 0%,20%,70%,100% {transform:translate(0,0)} 30%,60% {transform:translate(4px,-5px)} }
@keyframes omi-thinking-dot { 0%,66.666%,100% {opacity:.25} 33.333% {opacity:1} }
.omi-motion-thinking .omi-face{animation:omi-thinking-face 2.4s cubic-bezier(.22,1,.36,1) infinite}.omi-motion-thinking .omi-dot{animation:omi-thinking-dot .72s cubic-bezier(.22,1,.36,1) infinite}.omi-motion-thinking .omi-dot-b{animation-delay:-.24s}.omi-motion-thinking .omi-dot-c{animation-delay:-.48s}

.omi-motion-thinking .omi-a {transform-box:view-box}
.omi-motion-thinking[data-paused="true"] .omi-a {animation-play-state:paused}
.omi-motion-thinking[data-motion="off"] .omi-a {animation:none!important}
@media (prefers-reduced-motion:reduce) {.omi-motion-thinking .omi-a {animation:none!important}}</style>
  <g fill="#ffffff" stroke="#ffffff"><g transform="translate(32 32)"><g class="omi-a omi-body"><path d="M 181 212 C 166 220 145 222 124 222 C 61 222 25 191 25 132 C 25 70 61 34 124 34 C 187 34 225 68 225 130 C 225 153 221 170 212 184" fill="none" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><g class="omi-a omi-face"><path d="M 84 109 L 109 127 L 84 145 M 153 127 H 179" fill="none" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g stroke="none"><circle class="omi-a omi-dot" cx="222" cy="23" r="5"/><circle class="omi-a omi-dot omi-dot-b" cx="241" cy="23" r="5"/><circle class="omi-a omi-dot omi-dot-c" cx="260" cy="23" r="5"/></g></g>
</svg>
