<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" class="omi-motion omi-motion-running" role="img" aria-label="Omi · 执行" data-state="running" data-duration="1.2">
  <style>
@keyframes omi-running-line { 0% {opacity:0;transform:translateX(0)} 20% {opacity:1;transform:translateX(0)} 80% {opacity:1;transform:translateX(120px)} 100% {opacity:0;transform:translateX(120px)} }
.omi-motion-running .omi-progress{animation:omi-running-line 1.2s cubic-bezier(.22,1,.36,1) infinite}

.omi-motion-running .omi-a {transform-box:view-box}
.omi-motion-running[data-paused="true"] .omi-a {animation-play-state:paused}
.omi-motion-running[data-motion="off"] .omi-a {animation:none!important}
@media (prefers-reduced-motion:reduce) {.omi-motion-running .omi-a {animation:none!important}}</style>
