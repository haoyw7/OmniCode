<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" class="omi-expression omi-expr-error" role="img" aria-label="Omi · 出错" data-state="error" data-duration="4.8">
<style>@keyframes omi-expr-error-body{0%,25%,65%,100%{transform:translateY(0) rotate(0deg)}5%{transform:translateX(-3px) rotate(-6deg)}10%{transform:translateX(3px) rotate(6deg)}15%{transform:translateX(-2px) rotate(-4deg)}40%{transform:translateY(3px) rotate(0deg)}80%{transform:translateY(-2px) rotate(3deg)}}
