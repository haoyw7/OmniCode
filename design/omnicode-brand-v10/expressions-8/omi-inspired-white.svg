.omi-expr-inspired .omx-body{animation:omi-expr-inspired-body 2.4s cubic-bezier(.22,1,.36,1) infinite}
.omi-expr-inspired .omx-accent{animation:omi-expr-inspired-accent 2.4s cubic-bezier(.22,1,.36,1) infinite;transform-origin:156px 34px}
