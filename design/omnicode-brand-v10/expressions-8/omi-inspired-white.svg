<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" class="omi-expression omi-expr-inspired" role="img" aria-label="Omi · 灵感" data-state="inspired" data-duration="2.4">
<style>@keyframes omi-expr-inspired-body{0%,30%,100%{transform:translateY(0)}10%,20%{transform:translateY(-4px)}}
