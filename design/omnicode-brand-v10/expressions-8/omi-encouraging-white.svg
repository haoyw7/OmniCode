<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" class="omi-expression omi-expr-encouraging" role="img" aria-label="Omi · 鼓励" data-state="encouraging" data-duration="2.4">
<style>@keyframes omi-expr-encouraging-body{0%,20%,100%{transform:rotate(0deg)}10%{transform:rotate(3deg)}}
@keyframes omi-expr-encouraging-accent{0%,30%,100%{transform:translateY(0);opacity:.55}10%,20%{transform:translateY(-5px);opacity:1}}
@keyframes omi-expr-encouraging-wink{0%,20%,100%{transform:scaleY(1)}10%{transform:scaleY(.2)}}
.omi-expr-encouraging .omx-body{animation:omi-expr-encouraging-body 2.4s cubic-bezier(.22,1,.36,1) infinite;transform-origin:128px 128px}
.omi-expr-encouraging .omx-accent{animation:omi-expr-encouraging-accent 2.4s cubic-bezier(.22,1,.36,1) infinite}
.omi-expr-encouraging .omx-wink{animation:omi-expr-encouraging-wink 2.4s cubic-bezier(.22,1,.36,1) infinite;transform-origin:163px 127px}
.omi-expr-encouraging .omx-a{transform-box:view-box}
.omi-expr-encouraging[data-paused="true"] .omx-a{animation-play-state:paused}
.omi-expr-encouraging[data-motion="off"] .omx-a{animation:none!important}
@media(prefers-reduced-motion:reduce){.omi-expr-encouraging .omx-a{animation:none!important}}</style>
