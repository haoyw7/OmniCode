<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" class="omi-expression omi-expr-surprised" role="img" aria-label="Omi · 惊讶" data-state="surprised" data-duration="2.4">
<style>@keyframes omi-expr-surprised-body{0%,20%,100%{transform:translateY(0)}10%{transform:translateY(-7px)}}
