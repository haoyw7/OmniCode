[workspace]
resolver = "2"
members = ["src-tauri", "crates/process-tree", "crates/host-supervisor"]
exclude = ["vendor/portable-pty"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
