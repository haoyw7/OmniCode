<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/omnicode.svg" />
    <title>OmniCode</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var hue = localStorage.getItem("monocode.themeHue");
          var sat = localStorage.getItem("monocode.themeSaturation");
          var darkLightness = localStorage.getItem(
            "monocode.themeDarkLightness",
          );
          var opacity = localStorage.getItem("monocode.sidebarOpacity");
          if (hue != null) {
            var h = Math.max(0, Math.min(360, Number(hue) || 0));
            root.style.setProperty("--theme-hue", String(h));
          }
          if (sat != null) {
            var s = Math.max(0, Math.min(100, Number(sat) || 0));
            root.style.setProperty("--theme-saturation", s + "%");
          }
          if (darkLightness != null) {
            var l = Math.max(0, Math.min(30, Number(darkLightness) || 0));
            root.style.setProperty("--theme-dark-lightness", l + "%");
          }
          if (opacity != null) {
            var o = Math.max(0.15, Math.min(1, Number(opacity) || 0.85));
            root.style.setProperty("--sidebar-opacity", String(o));
          }
          var scheme = localStorage.getItem("monocode.desktopColorScheme");
          var skin = localStorage.getItem("monocode.desktopSkin");
          var skinSchemes = { midnight: "dark", atelier: "light", foundry: "dark", lagoon: "light", graphite: "dark", linen: "light", dusk: "dark", black: "dark", daylight: "light", meadow: "light" };
          var namedSkin = Object.prototype.hasOwnProperty.call(skinSchemes, skin);
          if (scheme === null) {
            scheme = namedSkin
              ? skinSchemes[skin]
              : skin && skin !== "auto" && skin !== "classic" ? "dark" : localStorage.getItem("monocode.colorScheme");
          }
          var light = namedSkin ? skinSchemes[skin] === "light" : scheme === "light" || scheme === "system" && window.matchMedia("(prefers-color-scheme: light)").matches;
          root.classList.toggle("theme-light", light);
          root.dataset.skin = namedSkin ? skin : light ? "daylight" : "midnight";
          root.dataset.desktopVisual = "claude-measured-v1";
          root.dataset.desktopMode = localStorage.getItem("monocode.desktopMode") === "chat" ? "chat" : "code";
          root.style.colorScheme = light ? "light" : "dark";
          var bodyGlass = localStorage.getItem("monocode.bodyGlass");
          if (bodyGlass == null || bodyGlass === "1" || bodyGlass === "true") {
            root.classList.add("glass-body");
          }
          var isMac =
            typeof navigator !== "undefined" &&
            /Mac|iPhone|iPad/.test(navigator.platform);
          if (isMac) {
            root.classList.add("is-mac");
          }
        } catch (_) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/shared/ui/branding/omi.css" />
    <style>
      :root {
        --theme-hue: 240;
        --theme-saturation: 0%;
        --theme-dark-lightness: 9%;
        --sidebar-opacity: 0.85;
        --background-lightness: var(--theme-dark-lightness);
        --color-background-base: hsl(
          var(--theme-hue) var(--theme-saturation) var(--background-lightness)
        );
      }

      html.theme-light {
        --background-lightness: 97%;
      }

      /* Match --color-app in desktop-theme.css before the stylesheet loads. */
      html[data-skin="midnight"] { --color-background-base: #242423; }
      html[data-skin="daylight"] { --color-background-base: #f9f9f7; }
      html[data-skin="foundry"] { --color-background-base: #100e0b; }
      html[data-skin="graphite"] { --color-background-base: #111214; }
      html[data-skin="dusk"] { --color-background-base: #121014; }
      html[data-skin="black"] { --color-background-base: #000000; }
      html[data-skin="atelier"] { --color-background-base: #f5f1eb; }
      html[data-skin="lagoon"] { --color-background-base: #dfeceb; }
      html[data-skin="linen"] { --color-background-base: #eceff3; }
      html[data-skin="meadow"] { --color-background-base: #ffffff; }

      html,
      body,
      #boot-splash {
        margin: 0;
        background: var(--color-background-base);
      }

      /* Opaque cover until React paints. The logo is in HTML so it is
         visible during the Dock bounce, before the bundle runs. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        color: #fff;
      }

      html.theme-light #boot-splash {
        color: #000;
      }

      /* Keep the native drag region available before the bundle runs. */
      #boot-splash-drag-region {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 40px;
        pointer-events: auto;
      }

      #boot-splash.boot-splash-out #boot-splash-drag-region {
        pointer-events: none;
      }

      #boot-splash svg {
        width: 108px;
        height: 108px;
        display: block;
        transform: scale(1);
      }

    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div id="boot-splash-drag-region" data-tauri-drag-region="deep"></div>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" class="omi-motion omi-motion-ready" data-ui="omi" data-animated="true" aria-hidden="true" data-state="ready" data-duration="2.88">

  <g fill="currentColor" stroke="currentColor"><g transform="translate(32 32)"><g class="omi-a omi-body"><path d="M 181 212 C 166 220 145 222 124 222 C 61 222 25 191 25 132 C 25 70 61 34 124 34 C 187 34 225 68 225 130 C 225 153 221 170 212 184" fill="none" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><g class="omi-a omi-face"><path d="M 84 109 L 109 127 L 84 145 M 153 127 H 179" fill="none" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></g>
</svg>

    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
