    <title>OmniCode</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var hue = localStorage.getItem("omnicode.themeHue");
          var sat = localStorage.getItem("omnicode.themeSaturation");
          var darkLightness = localStorage.getItem(
            "omnicode.themeDarkLightness",
          );
          var opacity = localStorage.getItem("omnicode.sidebarOpacity");
          if (hue != null) {
            var h = Math.max(0, Math.min(360, Number(hue) || 0));
            root.style.setProperty("--theme-hue", String(h));
          }
          if (sat != null) {
            var s = Math.max(0, Math.min(100, Number(sat) || 0));
            root.style.setProperty("--theme-saturation", s + "%");
          }
          if (darkLightness != null) {
            var l = Math.max(0, Math.min(30, Number(darkLightness) || 0));
            root.style.setProperty("--theme-dark-lightness", l + "%");
          }
          if (opacity != null) {
            var o = Math.max(0.15, Math.min(1, Number(opacity) || 0.85));
            root.style.setProperty("--sidebar-opacity", String(o));
          }
          var scheme = localStorage.getItem("omnicode.desktopColorScheme");
          var skin = localStorage.getItem("omnicode.desktopSkin");
          var skinSchemes = { ripple: "dark", midnight: "dark", atelier: "light", foundry: "dark", lagoon: "light", graphite: "dark", linen: "light", dusk: "dark", black: "dark", daylight: "light", meadow: "light" };
          var namedSkin = Object.prototype.hasOwnProperty.call(skinSchemes, skin);
          if (scheme === null) {
            scheme = namedSkin
              ? skinSchemes[skin]
              : skin && skin !== "auto" && skin !== "classic" ? "dark" : localStorage.getItem("omnicode.colorScheme");
          }
          var light = namedSkin ? skinSchemes[skin] === "light" : scheme === "light" || scheme === "system" && window.matchMedia("(prefers-color-scheme: light)").matches;
          root.classList.toggle("theme-light", light);
          root.dataset.skin = namedSkin ? skin : light ? "daylight" : "ripple";
          root.dataset.desktopVisual = "claude-measured-v1";
          root.dataset.desktopMode = localStorage.getItem("omnicode.desktopMode") === "chat" ? "chat" : "code";
          root.style.colorScheme = light ? "light" : "dark";
          var bodyGlass = localStorage.getItem("omnicode.bodyGlass");
          if (bodyGlass == null || bodyGlass === "1" || bodyGlass === "true") {
            root.classList.add("glass-body");
          }
          var isMac =
            typeof navigator !== "undefined" &&
            /Mac|iPhone|iPad/.test(navigator.platform);
          if (isMac) {
            root.classList.add("is-mac");
          }
        } catch (_) {}
      })();
    </script>

    <style>
      :root {
        --theme-hue: 240;
        --theme-saturation: 0%;
        --theme-dark-lightness: 9%;
        --sidebar-opacity: 0.85;
        --background-lightness: var(--theme-dark-lightness);
        --color-background-base: hsl(
          var(--theme-hue) var(--theme-saturation) var(--background-lightness)
        );
      }

      html.theme-light {
        --background-lightness: 97%;
      }

      /* Match --color-app in desktop-theme.css before the stylesheet loads. */
      html[data-skin="midnight"] { --color-background-base: #242423; }
      html[data-skin="daylight"] { --color-background-base: #f9f9f7; }
      html[data-skin="foundry"] { --color-background-base: #100e0b; }
      html[data-skin="graphite"] { --color-background-base: #111214; }
      html[data-skin="dusk"] { --color-background-base: #121014; }
      html[data-skin="black"] { --color-background-base: #000000; }
      html[data-skin="atelier"] { --color-background-base: #f5f1eb; }
      html[data-skin="lagoon"] { --color-background-base: #dfeceb; }
      html[data-skin="linen"] { --color-background-base: #eceff3; }
      html[data-skin="meadow"] { --color-background-base: #ffffff; }

      html,
      body,
      #boot-splash {
        margin: 0;
        background: var(--color-background-base);
      }

      /* Opaque cover until React paints. The logo is in HTML so it is
         visible during the Dock bounce, before the bundle runs. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        color: #fff;
      }

      html.theme-light #boot-splash {
        color: #000;
      }

      /* Keep the native drag region available before the bundle runs. */
      #boot-splash-drag-region {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 40px;
        pointer-events: auto;
      }

      #boot-splash.boot-splash-out #boot-splash-drag-region {
        pointer-events: none;
      }

      /* Mark and wordmark keep the approved horizontal lockup proportions:
         the wordmark is 0.675x lockup units, aligned to the mark's 256 box.
         The row shifts left by the mark's side bearing to centre the ink. */
      #boot-splash-brand {
        display: flex;
        align-items: center;
        transform: translateX(-9.6px);
      }

      #boot-splash-mark {
        width: 108px;
        height: 108px;
        display: block;
        animation: boot-splash-mark 1.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      #boot-splash-wordmark {
        width: 425.925px;
        height: 86.4px;
        margin-left: 6.75px;
        display: block;
        overflow: visible;
        animation: boot-splash-wordmark 1.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* Hold the centred mark, slide it left while the wordmark travels with
         it and unrolls from its edge, then hold the lockup. main.tsx waits
         for these before entering the app. */
      @keyframes boot-splash-mark {
        0%, 30% { transform: translateX(225.94px); }
        70%, 100% { transform: translateX(0); }
      }

      @keyframes boot-splash-wordmark {
        0%, 30% { opacity: 0; clip-path: inset(0 100% 0 0); transform: translateX(225.94px); }
        70%, 100% { opacity: 1; clip-path: inset(0 0 0 0); transform: translateX(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash-mark,
        #boot-splash-wordmark {
          animation: none;
        }
      }

    </style>
