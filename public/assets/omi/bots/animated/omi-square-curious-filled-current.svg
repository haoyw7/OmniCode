<style>@keyframes omi-expr-curious-body{0%,30%,65%,100%{transform:translateY(0) rotate(0deg)}5%,15%{transform:translateY(-4px) rotate(-7deg)}40%{transform:translateY(-2px) rotate(6deg)}45%{transform:translateY(0) rotate(-4deg)}80%{transform:translateY(-3px) rotate(3deg)}}
