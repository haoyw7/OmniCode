<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" class="omi-expression omi-expr-joyful" role="img" aria-label="Omi · 开心" data-state="joyful" data-duration="4.8">
<style>@keyframes omi-expr-joyful-body{0%,25%,65%,100%{transform:translateY(0) rotate(0deg)}5%{transform:translateY(-8px) rotate(-5deg)}10%{transform:translateY(0) rotate(0deg)}15%{transform:translateY(-5px) rotate(5deg)}40%{transform:translateY(-2px) rotate(-9deg)}45%{transform:translateY(-2px) rotate(9deg)}80%{transform:translateY(-3px) rotate(-4deg)}}
@keyframes omi-expr-joyful-accent{0%,40%,100%{opacity:.3}10%,30%{opacity:1}}
@keyframes omi-expr-joyful-gaze{0%,12%,52%,100%{transform:translateX(0)}17%,28%{transform:translateX(-6px)}36%,47%{transform:translateX(6px)}}
