<style>@keyframes omi-expr-inspired-body{0%,25%,60%,100%{transform:translateY(0) rotate(0deg)}5%,15%{transform:translateY(-7px) rotate(0deg)}35%{transform:translateY(-3px) rotate(-6deg)}40%{transform:translateY(-3px) rotate(6deg)}75%{transform:translateY(2px) rotate(0deg)}80%{transform:translateY(-4px) rotate(0deg)}}
