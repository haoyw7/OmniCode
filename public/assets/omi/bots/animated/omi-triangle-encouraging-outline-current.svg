<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" class="omi-expression omi-expr-encouraging" role="img" aria-label="Omi · 鼓励" data-state="encouraging" data-duration="4.8">
<style>@keyframes omi-expr-encouraging-body{0%,30%,65%,100%{transform:translateY(0) rotate(0deg)}5%{transform:translateY(3px) rotate(4deg)}10%{transform:translateY(-3px) rotate(0deg)}40%{transform:translateY(0) rotate(-7deg)}45%{transform:translateY(0) rotate(7deg)}80%{transform:translateY(-4px) rotate(0deg)}}
