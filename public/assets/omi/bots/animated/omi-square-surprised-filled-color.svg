<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" class="omi-expression omi-expr-surprised" role="img" aria-label="Omi · 惊讶" data-state="surprised" data-duration="4.8">
<style>@keyframes omi-expr-surprised-body{0%,25%,65%,100%{transform:translateY(0) rotate(0deg)}5%{transform:translateY(-9px) rotate(-5deg)}10%{transform:translateY(-6px) rotate(5deg)}15%{transform:translateY(2px) rotate(0deg)}40%{transform:translateY(0) rotate(-7deg)}45%{transform:translateY(0) rotate(7deg)}80%{transform:translateY(-3px) rotate(0deg)}}
