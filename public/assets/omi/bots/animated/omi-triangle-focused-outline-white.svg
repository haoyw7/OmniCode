<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" class="omi-expression omi-expr-focused" role="img" aria-label="Omi · 专注" data-state="focused" data-duration="4.8">
<style>@keyframes omi-expr-focused-body{0%,30%,65%,100%{transform:translateY(0) rotate(0deg)}10%{transform:translateY(2px) rotate(-4deg)}15%{transform:translateY(-2px) rotate(0deg)}45%{transform:translateY(0) rotate(5deg)}50%{transform:translateY(0) rotate(-3deg)}80%{transform:translateY(-3px) rotate(0deg)}}
@keyframes omi-expr-focused-gaze{0%,12%,52%,100%{transform:translateX(0)}17%,28%{transform:translateX(-6px)}36%,47%{transform:translateX(6px)}}
@keyframes omi-expr-focused-blink{0%,26%,31%,72%,77%,100%{transform:scaleY(1)}28%,74%{transform:scaleY(.12)}}
.omi-expr-focused .omx-body{animation:omi-expr-focused-body 4.8s cubic-bezier(.22,1,.36,1) infinite}
.omi-expr-focused .omx-body{transform-origin:128px 132px}
.omi-expr-focused .omx-gaze{animation:omi-expr-focused-gaze 4.8s cubic-bezier(.22,1,.36,1) infinite}
.omi-expr-focused .omx-blink{animation:omi-expr-focused-blink 4.8s cubic-bezier(.22,1,.36,1) infinite;transform-origin:128px 126px}
.omi-expr-focused .omx-a{transform-box:view-box}
.omi-expr-focused[data-paused="true"] .omx-a{animation-play-state:paused}
.omi-expr-focused[data-motion="off"] .omx-a{animation:none!important}
@media(prefers-reduced-motion:reduce){.omi-expr-focused .omx-a{animation:none!important}}</style>
