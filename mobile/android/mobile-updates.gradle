import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.time.Instant
import java.time.ZoneId
import java.time.format.DateTimeFormatter

def mobileRoot = rootProject.projectDir.parentFile
def lanConfig = new JsonSlurper().parse(new File(mobileRoot, 'update-config.json'))
def releaseUpdateConfig = new JsonSlurper().parse(new File(mobileRoot, 'update-config.release.json'))
def lanUpdates = System.getenv('MONOCODE_UPDATE_CHANNEL') == 'lan'
def updateConfig = lanUpdates ? lanConfig : releaseUpdateConfig
def projectVersion = new JsonSlurper().parse(new File(mobileRoot.parentFile, 'package.json')).version
// GitHub builds use the project version; explicit LAN builds keep the date label.
def buildVersionName = providers.gradleProperty('monocodeVersionName').getOrElse(
    lanUpdates ? DateTimeFormatter.ofPattern('MM-dd-HHmm')
        .withZone(ZoneId.of('America/Los_Angeles')).format(Instant.now()) : projectVersion)
def updateRoot = new File(System.getenv('MONOCODE_MOBILE_UPDATE_DIR') ?: new File(
    System.getenv('XDG_DATA_HOME') ?: new File(System.getProperty('user.home'), '.local/share').path,
    'monocode/mobile-updates').path)
def allocatesBuild = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() ==~ /(?i)(assemble.*|install.*|package.*|bundle.*|build)/
}
def nextCode = 1
if (allocatesBuild) {
    updateRoot.mkdirs()
    new RandomAccessFile(new File(updateRoot, 'version.lock'), 'rw').withCloseable { handle ->
        def lock = handle.channel.lock()
        try {
            def counter = new File(updateRoot, 'version-code')
            def latest = new File(updateRoot, 'latest.json')
            def previous = counter.exists() ? counter.text.trim().toInteger() : 1
            if (latest.exists()) previous = Math.max(previous, new JsonSlurper().parse(latest).versionCode as int)
            nextCode = Math.addExact(previous, 1)
            if (nextCode > 2100000000) throw new GradleException('Android versionCode limit reached')
            def temporary = new File(updateRoot, 'version-code.tmp')
            temporary.text = nextCode.toString()
            Files.move(temporary.toPath(), counter.toPath(), StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE)
        } finally { lock.release() }
    }
}

android {
    buildFeatures { buildConfig true }
    defaultConfig {
        versionCode nextCode
        versionName buildVersionName
        def updateSources = ([updateConfig.baseUrl] + (updateConfig.baseUrls ?: [])).unique()
        buildConfigField 'String[]', 'MONOCODE_UPDATE_BASE_URLS',
            'new String[]{' + updateSources.collect { JsonOutput.toJson(it) }.join(',') + '}'
        buildConfigField 'String', 'MONOCODE_UPDATE_DOWNLOAD_PREFIX',
            JsonOutput.toJson(lanUpdates ? '/apk/' : releaseUpdateConfig.downloadPrefix)
    }
    buildTypes {
        release {
            def updateSources = ([releaseUpdateConfig.baseUrl] + releaseUpdateConfig.baseUrls).unique()
            buildConfigField 'String[]', 'MONOCODE_UPDATE_BASE_URLS',
                'new String[]{' + updateSources.collect { JsonOutput.toJson(it) }.join(',') + '}'
            buildConfigField 'String', 'MONOCODE_UPDATE_DOWNLOAD_PREFIX',
                JsonOutput.toJson(releaseUpdateConfig.downloadPrefix)
        }
    }
}

android.applicationVariants.all { variant ->
    // GitHub Release builds never advance the LAN feed, even when signed.
    if (lanUpdates && variant.buildType.name != 'release' && variant.signingConfig != null && System.getenv('MONOCODE_MOBILE_DEFER_PUBLISH') != '1') {
        variant.packageApplicationProvider.configure {
            doLast {
                exec {
                    commandLine 'node', new File(mobileRoot, 'publish-update.mjs').path,
                        new File(buildDir, "outputs/apk/${variant.dirName}").path, '--serve'
                }
            }
        }
    }
}
