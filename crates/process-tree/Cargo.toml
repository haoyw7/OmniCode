[package]
name = "monocode-process-tree"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Isolated provider process trees: spawn, signal and reap them as a unit"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
